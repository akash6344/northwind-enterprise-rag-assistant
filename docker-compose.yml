services:
  api:
    build: .
    env_file:
      - .env
    ports:
      - "8000:8000"
    volumes:
      - ./KnowledgeBase:/app/KnowledgeBase:ro
      - ./storage:/app/storage
  ui:
    build: .
    env_file:
      - .env
    environment:
      API_URL: http://api:8000/chat
    command: streamlit run streamlit_ui/app.py --server.address 0.0.0.0 --server.port 8501
    ports:
      - "8501:8501"
    depends_on:
      - api
    volumes:
      - ./KnowledgeBase:/app/KnowledgeBase:ro
      - ./storage:/app/storage
